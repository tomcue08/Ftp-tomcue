name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          SRC="$(find . -name main.dart -not -path './.git/*' | head -n 1)"
          cp "$SRC" /tmp/main.dart
          flutter create --platforms=android --org com.ps4ftp .
          mkdir -p lib
          cp /tmp/main.dart lib/main.dart
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle*
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-ftp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
